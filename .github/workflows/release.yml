name: release

on:
  push:
    tags: ['v*']

# only publish can write, so a bad build step can't push to the repo or swap release files
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - name: signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/spendrix.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=androiddebugkey\nstoreFile=%s\n' \
            "$KEY_PASSWORD" "$KEY_PASSWORD" "$RUNNER_TEMP/spendrix.jks" > android/key.properties
      # one apk for every phone, so nobody has to know their chip
      - run: |
          flutter build apk --release
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk out/Spendrix-android.apk
      # 1.3 to 2.0.1 installed as com.spendrix, and a phone only updates an app with the same id
      - run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk out/Spendrix-android-for-1.3-and-2.0.apk
        env: { SPENDRIX_APP_ID: com.spendrix }
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      # unsigned: installable only by sideloading until there is an Apple developer account
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p out/Payload
          cp -R build/ios/iphoneos/Runner.app out/Payload/
          (cd out && zip -qr Spendrix-iphone.ipa Payload && rm -r Payload)
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/* }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - run: flutter build macos --release --dart-define=GOOGLE_DESKTOP_SECRET=${{ secrets.GOOGLE_DESKTOP_SECRET }}
      - run: |
          mkdir out
          hdiutil create -volname Spendrix -srcfolder build/macos/Build/Products/Release/Spendrix.app -ov -format UDZO out/Spendrix-macos.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - run: flutter build windows --release --dart-define=GOOGLE_DESKTOP_SECRET=${{ secrets.GOOGLE_DESKTOP_SECRET }}
      # intel npu runtime (~100 MB): only loaded for the npu backend, which the app never picks
      - run: Get-ChildItem build/windows/x64/runner/Release -Recurse -Include LiteRtDispatch.dll, openvino*.dll, tbb*.dll | Remove-Item
      # flutter doesn't bundle the vc++ runtime, and a fresh windows install doesn't have it
      - run: Copy-Item C:/Windows/System32/msvcp140.dll, C:/Windows/System32/vcruntime140.dll, C:/Windows/System32/vcruntime140_1.dll build/windows/x64/runner/Release/
      - run: |
          mkdir out
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath out/Spendrix-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev lld
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - run: flutter build linux --release --dart-define=GOOGLE_DESKTOP_SECRET=${{ secrets.GOOGLE_DESKTOP_SECRET }}
      - run: |
          mkdir out
          tar -czf out/Spendrix-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/* }

  publish:
    needs: [android, ios, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v5
        with: { path: out, merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" out/* --title "Spendrix ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
