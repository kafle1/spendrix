name: spendrix
description: Spendrix, a private money diary with on-device AI.
publish_to: 'none'
# the build number stays above 4009, the highest android version code 2.0.2 shipped with
version: 2.1.2+4013

environment:
  sdk: ^3.13.0

dependencies:
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  device_info_plus: ^13.2.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_gemma: ^1.9.0
  flutter_gemma_litertlm: ^1.8.1
  hive_ce: ^2.20.0
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  record: ^7.1.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: assets/icon/icon-bg.png
  adaptive_icon_foreground: assets/icon/icon-fg.png
  adaptive_icon_monochrome: assets/icon/icon-mono.png
  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: assets/icon/icon-ios-dark.png
  image_path_ios_tinted_grayscale: assets/icon/icon-ios-tinted.png
  # web icons are made by hand (rounded "any" icons, square maskable ones), so don't overwrite them
  web:
    generate: false
  windows:
    generate: true
    image_path: assets/icon/icon-round.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon-macos.png
